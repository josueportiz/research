site_name: Investigación Académica
site_description: Sitio web académico y de investigación
site_url: https://josueportiz.github.io/research/
repo_url: https://github.com/josueportiz/research
repo_name: josueportiz/research

nav:
  - Inicio: index.md
  - Proyectos:
      - Visión general: proyectos/index.md
      - Proyecto Alfa: proyectos/proyecto-alfa.md
  - Ofertas TFG/TFM:
      - Visión general: tfx/index.md
      - Activas:
          - Ejemplo TFG: tfx/ofertas-activas/ejemplo-tfg.md
      - Histórico:
          - TFM 2025 BITalino: tfx/historico/tfm-2025-bitalino.md
      - Plantilla: tfx/plantilla-propuesta.md
  - Recursos para Alumnos:
      - Memorias: recursos/guias-memorias.md
      - Presentaciones: recursos/presentaciones.md
      - LaTeX: recursos/plantillas-latex.md
  - Publicaciones: publicaciones/index.md

theme:
  name: material
  language: es
  font:
    text: Inter
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.instant
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: false
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

extra:
  alternate:
    - name: Español
      link: /research/
      lang: es
    - name: English
      link: /research/en/
      lang: en

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
